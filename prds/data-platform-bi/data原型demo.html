/* --- Plan List --- */
function renderPlanList(){
  var filters=['all','DRAFT','EXECUTING','COMPLETED','CANCELLED'];

  var plans=S.planFilter==='all'?PLANS:PLANS.filter(function(p){return p.status===S.planFilter;});
  var rows=plans.map(function(p){
    var canCancel=p.status==='EXECUTING';
    var canEffect=p.status==='COMPLETED';
    var canEdit=p.status==='DRAFT';
    return '<tr class="border-t border-slate-100 hover:bg-slate-50"><td class="px-3 py-2.5 text-sm font-medium">'+h(p.name)+'</td><td class="px-3 py-2.5 text-sm">'+h(p.topicName)+'</td><td class="px-3 py-2.5"><span class="badge '+statusClass(p.status)+'">'+statusLabel(p.status)+'</span></td><td class="px-3 py-2.5 text-sm text-right">'+fmt(p.userCount)+'</td><td class="px-3 py-2.5 text-xs text-slate-500">'+h(p.sendTime||'-')+'</td><td class="px-3 py-2.5 text-xs text-slate-500">'+h(p.creator)+'<br/>'+h(p.createdAt)+'</td><td class="px-3 py-2.5 text-right space-x-1">'+
      (canEdit?'<button data-edit-draft="'+h(p.id)+'" class="text-xs text-brand-600 hover:underline">编辑</button>':'')+

/* --- Plan Detail --- */
function renderPlanDetail(){

    '<div class="flex items-center justify-between"><h2 class="text-xl font-bold">'+h(p.name)+'</h2><div class="flex items-center gap-2"><span class="badge '+statusClass(p.status)+'">'+statusLabel(p.status)+'</span>'+(p.status==='COMPLETED'?'<button data-plan-report="'+h(p.id)+'" class="btn-primary text-sm">查看效果</button>':'')+(p.status==='EXECUTING'?'<button data-cancel-plan="'+h(p.id)+'" class="btn-outline text-sm text-red-600 border-red-200">取消计划</button>':'')+'</div></div>'+
    '<div class="card"><h3 class="font-medium mb-3">基本信息</h3><div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm"><div><span class="text-xs text-slate-500 block">计划ID</span><span class="font-mono">'+h(p.id)+'</span></div><div><span class="text-xs text-slate-500 block">关联专题</span><span>'+h(p.topicName)+'</span></div><div><span class="text-xs text-slate-500 block">创建人/时间</span><span>'+h(p.creator)+' · '+h(p.createdAt)+'</span></div><div><span class="text-xs text-slate-500 block">用户数</span><span class="font-semibold">'+fmt(totalUsers)+'</span></div></div></div>'+
    '<div class="card"><h3 class="font-medium mb-3">医助执行情况</h3><div class="grid grid-cols-4 gap-4 text-center"><div><div class="text-xs text-slate-500">已发送</div><div class="text-lg font-bold text-emerald-700">'+fmt(sentCount)+'</div></div><div><div class="text-xs text-slate-500">未发送</div><div class="text-lg font-bold text-amber-600">'+fmt(notSent)+'</div></div><div><div class="text-xs text-slate-500">发送失败</div><div class="text-lg font-bold text-red-600">'+fmt(failCount)+'</div></div><div><div class="text-xs text-slate-500">到达率</div><div class="text-lg font-bold">'+arrivalRate+'</div></div></div></div>'+
  '</div>';
}

/* --- Plan Report --- */
function renderPlanReport(){
  var p=PLANS.find(function(x){return x.id===S.planDetailId;})||PLANS[0];
  var e=EFFECT;
  function metricCard(label,key){
    var before=e.before[key],after=e.after[key],delta=after-before;
    var color=key==='delete_rate'?(delta>0?'text-red-600':'text-emerald-600'):(delta>0?'text-emerald-600':'text-red-600');
    return '<div class="kpi-card"><div class="kpi-label">'+h(label)+'</div><div class="kpi-val">'+pct(after)+'</div><div class="text-xs mt-1 '+color+'">'+(delta>=0?'+':'')+pct(delta)+' vs 激活前'+pct(before)+'</div></div>';
  }
  var barMax=0.30;
  var barChart=e.trend.map(function(t){var h1=Math.round(t.open/barMax*100);var h2=Math.round(t.intent/barMax*100);return '<div class="flex-1 flex flex-col items-center gap-1"><div class="flex items-end gap-0.5 h-[100px]"><div class="w-3 bg-brand-400 rounded-t" style="height:'+h1+'%"></div><div class="w-3 bg-blue-400 rounded-t" style="height:'+h2+'%"></div></div><div class="text-[10px] text-slate-400">'+h(t.day)+'</div></div>';}).join('');
  var trendRows=e.trend.map(function(t){return '<tr class="border-t border-slate-100"><td class="px-3 py-1.5 text-xs font-mono">'+h(t.day)+'</td><td class="px-3 py-1.5 text-right">'+pct(t.open)+'</td><td class="px-3 py-1.5 text-right">'+pct(t.del)+'</td><td class="px-3 py-1.5 text-right">'+pct(t.intent)+'</td><td class="px-3 py-1.5 text-right">'+pct(t.conv)+'</td></tr>';}).join('');
  return '<div class="space-y-5">'+
    '<div class="flex items-center gap-2 text-sm text-slate-500"><button data-nav="plan_list" class="hover:underline">激活计划</button><span>></span><button data-plan-detail="'+h(p.id)+'" class="hover:underline">'+h(p.name)+'</button><span>></span><span class="text-slate-900 font-medium">效果报表</span></div>'+
    '<h2 class="text-xl font-bold">效果报表</h2>'+
    '<div class="card"><h3 class="font-medium mb-3">计划执行情况</h3><div class="grid grid-cols-4 gap-4 text-center"><div><div class="text-xs text-slate-500">已发送</div><div class="text-lg font-bold text-emerald-700">'+fmt(p.sendCount)+'</div></div><div><div class="text-xs text-slate-500">未发送</div><div class="text-lg font-bold text-amber-600">'+fmt(p.userCount-p.sendCount-p.failCount)+'</div></div><div><div class="text-xs text-slate-500">发送失败</div><div class="text-lg font-bold text-red-600">'+fmt(p.failCount)+'</div></div><div><div class="text-xs text-slate-500">到达率</div><div class="text-lg font-bold">'+(p.userCount>0?pct(p.sendCount/p.userCount):'—')+'</div></div></div></div>'+
    '<div class="card"><h3 class="font-medium mb-3">计划摘要</h3><div class="grid grid-cols-5 gap-3 text-sm"><div><span class="text-xs text-slate-500 block">计划</span>'+h(p.name)+'</div><div><span class="text-xs text-slate-500 block">关联专题</span>'+h(p.topicName)+'</div><div><span class="text-xs text-slate-500 block">发送时间</span>'+h(p.sendTime||'-')+'</div><div><span class="text-xs text-slate-500 block">发送人数</span><b>'+fmt(p.sendCount)+'</b></div><div><span class="text-xs text-slate-500 block">到达人数</span><b>'+fmt(p.sendCount)+'</b></div></div></div>'+
    '<div class="grid grid-cols-4 gap-4">'+metricCard('开口率','open_rate')+metricCard('删除率','delete_rate')+metricCard('意向提升率','intent_up')+metricCard('成交转化率','conv_rate')+'</div>'+
    '<div class="grid grid-cols-2 gap-4"><div class="card"><h3 class="font-medium mb-3">激活后7天趋势</h3><div class="flex items-center gap-4 mb-2 text-xs"><span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-brand-400 inline-block"></span>开口率</span><span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-blue-400 inline-block"></span>意向提升率</span></div><div class="flex items-end gap-2 px-2">'+barChart+'</div></div><div class="card overflow-x-auto"><h3 class="font-medium mb-3">趋势数据</h3><table class="min-w-full text-sm"><thead><tr class="text-left text-xs text-slate-500 border-b"><th class="px-3 py-1.5">日期</th><th class="px-3 py-1.5 text-right">开口率</th><th class="px-3 py-1.5 text-right">删除率</th><th class="px-3 py-1.5 text-right">意向提升</th><th class="px-3 py-1.5 text-right">成交率</th></tr></thead><tbody>'+trendRows+'</tbody></table></div></div>'+
    '<div class="text-xs text-slate-400">注：效果报表仅展示关联计划的前后变化，不保证排除其他营销活动干扰</div>'+
  '</div>';
}

/* ===== Events ===== */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(function(el){el.addEventListener('click',function(){var p=el.getAttribute('data-nav');S.page=p;S.createStep=1;if(p==='profile'){S.profileAllTags=false;S.tagDetailUserId=null;}render();});});
  document.querySelectorAll('[data-profile-tag-filter]').forEach(function(el){el.addEventListener('change',function(){var cat=el.getAttribute('data-profile-tag-filter');S.profileTagFilters[cat]=el.value==='全部'?undefined:el.value;if(!S.profileTagFilters[cat])delete S.profileTagFilters[cat];render();});});
  var pq=document.getElementById('btn-profile-query');if(pq)pq.addEventListener('click',function(){toast('查询已刷新','success');render();});
  var pr=document.getElementById('btn-profile-reset');if(pr)pr.addEventListener('click',function(){S.profileTagFilters={};render();toast('筛选已重置','success');});
  document.querySelectorAll('[data-tag-detail]').forEach(function(el){el.addEventListener('click',function(){S.tagDetailUserId=el.getAttribute('data-tag-detail');render();});});
  var vat=document.getElementById('btn-view-all-tags');if(vat)vat.addEventListener('click',function(){S.profileAllTags=true;render();});
  var bp=document.getElementById('btn-back-profile');if(bp)bp.addEventListener('click',function(){S.profileAllTags=false;S.tagDetailUserId=null;render();});
  document.querySelectorAll('[data-topic-detail]').forEach(function(el){el.addEventListener('click',function(){S.topicDetailId=el.getAttribute('data-topic-detail');S.page='topic_detail';render();});});
  document.querySelectorAll('[data-plan-detail]').forEach(function(el){el.addEventListener('click',function(){S.planDetailId=el.getAttribute('data-plan-detail');S.page='plan_detail';render();});});
  document.querySelectorAll('[data-plan-report]').forEach(function(el){el.addEventListener('click',function(){S.planDetailId=el.getAttribute('data-plan-report');S.page='plan_report';render();});});
  document.querySelectorAll('[data-plan-filter]').forEach(function(el){el.addEventListener('click',function(){S.planFilter=el.getAttribute('data-plan-filter');render();});});
  document.querySelectorAll('[data-cancel-plan]').forEach(function(el){el.addEventListener('click',function(){S._actionPlanId=el.getAttribute('data-cancel-plan');S.modal='cancel';render();});});
  document.querySelectorAll('[data-dismiss]').forEach(function(el){el.addEventListener('click',function(){S.modal=null;render();});});
  var cc=document.getElementById('btn-confirm-cancel');
  if(cc) cc.addEventListener('click',function(){var r=(document.getElementById('ta-cancel')||{}).value||'';if(r.length<10){toast('取消原因至少10个字','error');return;}var p=PLANS.find(function(x){return x.id===S._actionPlanId;});if(p)p.status='CANCELLED';S.modal=null;toast('计划已取消','success');render();});
  var ce=document.getElementById('btn-confirm-export');
  if(ce) ce.addEventListener('click',function(){S.modal=null;toast('导出已开始，请稍候下载','success');render();});
  var ex=document.getElementById('btn-export');
  if(ex) ex.addEventListener('click',function(){S.modal='export';render();});
  document.querySelectorAll('[data-topic-tag]').forEach(function(el){el.addEventListener('click',function(){var k=el.getAttribute('data-topic-tag');S.newTopicTags[k]=!S.newTopicTags[k];if(!S.newTopicTags[k])delete S.newTopicTags[k];render();});});
  var lg=document.getElementById('btn-logic');
  if(lg) lg.addEventListener('click',function(){S.newTopicLogic=S.newTopicLogic==='AND'?'OR':'AND';render();});
  var st=document.getElementById('btn-save-topic');
  if(st) st.addEventListener('click',function(){var name=(document.getElementById('inp-topic-name')||{}).value||'';if(!name){toast('请填写专题名称','error');return;}if(!Object.keys(S.newTopicTags).length){toast('请至少选择一个标签','error');return;}TOPICS.push({id:'T'+(100+TOPICS.length),name:name,preset:false,condition:Object.keys(S.newTopicTags).join(' '+S.newTopicLogic+' '),count:Math.round(50+Math.random()*400),tags:{}});S.newTopicTags={};S.newTopicName='';toast('专题已保存','success');S.page='topic_list';render();});
  var sp=document.getElementById('btn-submit-plan');
  if(sp) sp.addEventListener('click',function(){S._successMsg='激活计划已提交，消息将通过企微发送给目标用户';S.modal='success';render();});
  var sd=document.getElementById('btn-save-draft');
  if(sd) sd.addEventListener('click',function(){toast('已保存为草稿','success');S.page='plan_list';render();});
  document.querySelectorAll('[data-edit-draft]').forEach(function(el){el.addEventListener('click',function(){S.createTopicId=(PLANS.find(function(p){return p.id===el.getAttribute('data-edit-draft');})||{}).topicId||'T001';S.page='plan_create';render();});});
  var ta=document.getElementById('ta-msg');if(ta)ta.addEventListener('input',function(){S.createMsg=ta.value;});
  var tcp=document.getElementById('btn-topic-create-plan');
  if(tcp) tcp.addEventListener('click',function(){S.createTopicId=S.topicDetailId;S.page='plan_create';render();});
  var selAll=document.getElementById('cb-select-all');
  if(selAll) selAll.addEventListener('change',function(){document.querySelectorAll('.topic-user-cb').forEach(function(cb){cb.checked=selAll.checked;});});
  document.querySelectorAll('[data-edit-tag]').forEach(function(el){el.addEventListener('click',function(){S._editTagName=el.getAttribute('data-edit-tag');S.modal='editTag';render();});});
  var cet=document.getElementById('btn-confirm-edit-tag');
  if(cet) cet.addEventListener('click',function(){var r=(document.getElementById('ta-edit-reason')||{}).value||'';if(r.length<10){toast('修改原因至少10个字','error');return;}S.modal=null;toast('标签已修改','success');render();});
  document.onkeydown=function(e){if(e.key==='Escape'&&S.modal){S.modal=null;render();}};
}

render();
})();
</script>
</body>
</html>
