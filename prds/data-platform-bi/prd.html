<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>数据中台与T+1 BI看板 — PRD V1.6</title>
<style>
:root{--brand:#4f46e5;--brand-light:#eef2ff;--text:#1e293b;--text2:#475569;--border:#e2e8f0;--bg:#f8fafc;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:15px;scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);line-height:1.7;}
.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh;}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:#111827;color:#dbe4f0;border-right:1px solid #1f2937;padding:24px 18px;}
.side-brand{padding:4px 8px 18px;border-bottom:1px solid rgba(226,232,240,.14);margin-bottom:16px;}
.side-brand h1{font-size:1rem;line-height:1.35;color:#fff;margin-bottom:8px;font-weight:700;}
.side-brand p{font-size:.78rem;color:#94a3b8;line-height:1.5;}
.w{max-width:1040px;margin:0 auto;padding:40px 32px 80px;width:100%;}
.hdr{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:48px 40px;border-radius:16px;margin-bottom:40px;}
.hdr h1{font-size:1.8rem;margin-bottom:16px;font-weight:700;}
.hdr .m{display:flex;flex-wrap:wrap;gap:12px 24px;font-size:.85rem;opacity:.9;}
.toc{padding:0;margin:0;}
.toc h2{font-size:.78rem;margin:0 0 10px;padding:0 8px;color:#94a3b8;letter-spacing:.08em;font-weight:700;}
.toc ol{list-style:none;padding:0;margin:0;font-size:.86rem;line-height:1.45;}
.toc li{margin:2px 0;}
.toc a{display:block;color:#cbd5e1;text-decoration:none;border-radius:8px;padding:7px 8px;}
.toc a:hover{background:#1f2937;color:#fff;}
h2{font-size:1.35rem;font-weight:700;margin:48px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--brand);color:var(--brand);scroll-margin-top:24px;}
h3{font-size:1.1rem;font-weight:700;margin:32px 0 12px;color:var(--text);scroll-margin-top:24px;}
h4{font-size:.98rem;font-weight:600;margin:24px 0 8px;color:var(--text2);scroll-margin-top:24px;}
h5{font-size:.9rem;font-weight:600;margin:20px 0 8px;color:var(--text2);}
p,ul,ol{margin-bottom:12px;}ul,ol{padding-left:24px;}li{margin-bottom:4px;}
code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.85em;color:#7c3aed;}
blockquote{border-left:4px solid var(--brand);background:var(--brand-light);padding:12px 16px;margin:12px 0 16px;border-radius:0 8px 8px 0;font-size:.9rem;color:var(--text2);}
hr{border:none;border-top:1px solid var(--border);margin:32px 0;}
.tw{overflow-x:auto;margin:12px 0 20px;}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:600px;}
th{background:#f1f5f9;font-weight:600;text-align:left;padding:10px 12px;border:1px solid var(--border);white-space:nowrap;}
td{padding:8px 12px;border:1px solid var(--border);vertical-align:top;}
tr:nth-child(even) td{background:#fafbfc;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:20px;}
.card h3{margin-top:0;}
.pre{background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:8px;padding:16px;font-size:.82rem;color:var(--text2);white-space:pre-wrap;font-family:monospace;line-height:1.6;margin:12px 0 16px;overflow-x:auto;}
.top{position:fixed;bottom:24px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;border:none;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:.7;z-index:100;}
.top:hover{opacity:1;}
@media print{body{background:#fff;}.layout{display:block;}.side,.top{display:none;}.w{max-width:100%;padding:0;}}
@media(max-width:900px){.layout{display:block;}.side{position:relative;height:auto;max-height:45vh;}.w{padding:24px 16px 80px;}.hdr{padding:28px 20px;}.hdr h1{font-size:1.3rem;}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="side-brand">
      <h1>数据中台与T+1 BI看板 PRD</h1>
      <p>左侧目录会在浏览文档时保持可见，便于评审时快速跳转。</p>
    </div>
    <nav id="toc-root" class="toc"></nav>
  </aside>
  <main class="w" id="md-root"></main>
</div>
<button class="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
<script>
// We load the PRD markdown and render it client-side using a minimal built-in renderer
// This keeps the HTML small and maintainable
var defined_sections = null; // will be populated

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderMd(md){
  // Remove wrapping ```markdown ... ```
  md = md.replace(/^```markdown\s*/,'').replace(/\s*```\s*$/,'');
  var lines = md.split('\n');
  var html = '';
  var inTable = false, inList = false, inBlockquote = false, inCode = false;
  var tocItems = [];
  var sectionCount = 0;

  function closeTable(){if(inTable){html+='</tbody></table></div>';inTable=false;}}
  function closeList(){if(inList){html+='</ul>';inList=false;}}
  function closeBq(){if(inBlockquote){html+='</blockquote>';inBlockquote=false;}}
  function closeCode(){if(inCode){html+='</div>';inCode=false;}}
  function closeAll(){closeTable();closeList();closeBq();closeCode();}

  for(var i=0;i<lines.length;i++){
    var line = lines[i];

    // Code block
    if(line.match(/^```/)){
      if(inCode){closeCode();continue;}
      else{closeAll();html+='<div class="pre">';inCode=true;continue;}
    }
    if(inCode){html+=escHtml(line)+'\n';continue;}

    // Heading
    var hm = line.match(/^(#{1,5})\s+(.*)/);
    if(hm){
      closeAll();
      var lvl = hm[1].length;
      var txt = hm[2].replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
      var sid = 'sec'+(sectionCount++);
      if(lvl<=2) tocItems.push({lvl:lvl,txt:hm[2],id:sid});
      html+='<h'+lvl+' id="'+sid+'">'+txt+'</h'+lvl+'>';
      continue;
    }

    // Table row
    if(line.match(/^\|/)){
      var cells = line.split('|').slice(1);
      if(cells.length && cells[cells.length-1].trim()==='') cells.pop();
      // separator row
      if(cells.every(function(c){return c.trim().match(/^[-:]+$/);})){continue;}
      if(!inTable){
        closeAll();
        html+='<div class="tw"><table><thead><tr>';
        cells.forEach(function(c){html+='<th>'+formatInline(c.trim())+'</th>';});
        html+='</tr></thead><tbody>';
        inTable=true;
      } else {
        html+='<tr>';
        cells.forEach(function(c){html+='<td>'+formatInline(c.trim())+'</td>';});
        html+='</tr>';
      }
      continue;
    } else { closeTable(); }

    // Blockquote
    var bqm = line.match(/^>\s?(.*)/);
    if(bqm){
      if(!inBlockquote){closeAll();html+='<blockquote>';inBlockquote=true;}
      html+=formatInline(bqm[1])+'<br/>';
      continue;
    } else { closeBq(); }

    // Unordered list
    var ulm = line.match(/^(\s*)[-*]\s+(.*)/);
    if(ulm){
      if(!inList){closeAll();html+='<ul>';inList=true;}
      html+='<li>'+formatInline(ulm[2])+'</li>';
      continue;
    }
    // Ordered list
    var olm = line.match(/^(\s*)\d+\.\s+(.*)/);
    if(olm){
      if(!inList){closeAll();html+='<ul>';inList=true;}
      html+='<li>'+formatInline(olm[2])+'</li>';
      continue;
    }
    closeList();

    // HR
    if(line.match(/^---/)){closeAll();html+='<hr/>';continue;}

    // Empty
    if(line.trim()===''){closeAll();continue;}

    // Paragraph
    closeAll();
    html+='<p>'+formatInline(line)+'</p>';
  }
  closeAll();

  // Build TOC
  var tocHtml='<h2>目录</h2><ol>';
  tocItems.forEach(function(t){
    tocHtml+='<li><a href="#'+t.id+'">'+escHtml(t.txt.replace(/\*\*/g,''))+'</a></li>';
  });
  tocHtml+='</ol>';

  // Header
  var header='<div class="hdr"><h1>数据中台与T+1 BI看板产品需求文档（PRD）</h1><div class="m"><span>📄 模块：data-platform-bi</span><span>📌 版本：V1.6</span><span>📅 创建：2026-05-14</span><span>🔄 更新：2026-05-17</span><span>👤 作者：产品（AI辅助起草）</span></div></div>';

  return {toc: tocHtml, content: header + html};
}

function formatInline(s){
  s = escHtml(s);
  s = s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/`(.*?)`/g,'<code>$1</code>');
  s = s.replace(/&lt;br\/?&gt;/g,'<br/>');
  s = s.replace(/\[(.*?)\]\((.*?)\)/g,'<a href="$2" style="color:var(--brand)">$1</a>');
  return s;
}

// Fetch the PRD.md file (same directory)
fetch('PRD.md').then(function(r){return r.text();}).then(function(md){
  var rendered = renderMd(md);
  document.getElementById('toc-root').innerHTML = rendered.toc;
  document.getElementById('md-root').innerHTML = rendered.content;
}).catch(function(e){
  // Fallback: show error
  document.getElementById('md-root').innerHTML = '<div class="card"><h3>⚠️ 无法加载 PRD.md</h3><p>请确保 prd.html 与 PRD.md 在同一目录下，并通过 HTTP 服务器访问（非直接 file:// 打开）。</p><p>快速启动：在终端执行 <code>cd '+escHtml(location.pathname.replace(/\/[^/]*$/,''))+' && python3 -m http.server 8888</code>，然后访问 <code>http://localhost:8888/prd.html</code></p><p>错误详情：'+escHtml(String(e))+'</p></div>';
});
</script>
</body>
</html>
