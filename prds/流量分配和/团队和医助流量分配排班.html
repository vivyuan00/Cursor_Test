<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>团队 / 医助流量分配排班 · 原型</title>
<style>
:root {
  --primary: #1677ff;
  --primary-hover: #4096ff;
  --primary-light: #e6f4ff;
  --success: #52c41a;
  --warning: #faad14;
  --danger: #ff4d4f;
  --ink: #1f1f1f;
  --muted: #8c8c8c;
  --line: #f0f0f0;
  --bg: #f5f5f5;
  --card: #fff;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 2px 8px rgba(0,0,0,.04);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5715 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.page { max-width: 1480px; margin: 0 auto; padding: 20px 24px 48px; }
.page-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.page-desc { color: var(--muted); margin: 0 0 16px; font-size: 13px; }

.tabs, .sub-tabs {
  display: flex; gap: 0; background: var(--card); padding: 0 16px;
  border-bottom: 1px solid var(--line);
}
.tabs { border-radius: var(--radius) var(--radius) 0 0; margin-bottom: 0; }
.sub-tabs { margin-bottom: 0; background: #fafafa; }
.tab, .sub-tab {
  padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent;
  color: var(--muted); font-weight: 500; margin-bottom: -1px; transition: all .2s;
}
.sub-tab { padding: 10px 18px; font-size: 13px; }
.tab:hover, .sub-tab:hover { color: var(--primary); }
.tab.active, .sub-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

.filter-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  background: var(--card); padding: 16px; border-radius: 0 0 var(--radius) var(--radius);
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.field.wide { min-width: 200px; flex: 1; max-width: 280px; }
.field label { font-size: 12px; color: var(--muted); }
select, input[type="text"], input[type="number"], input[type="time"] {
  height: 32px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 6px;
  font: inherit; background: #fff; outline: none; width: 100%;
}
select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.1); }
.filter-actions { margin-left: auto; display: flex; gap: 8px; }

.btn {
  height: 32px; padding: 0 15px; border-radius: 6px; border: 1px solid #d9d9d9;
  background: #fff; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s; white-space: nowrap;
}
.btn:hover { color: var(--primary); border-color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-link { border: none; background: none; color: var(--primary); padding: 0 8px; height: auto; }
.btn-link.danger { color: var(--danger); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.channel-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  margin-bottom: 16px; overflow: hidden; border: 1px solid var(--line);
}
.channel-inner { display: grid; grid-template-columns: 260px 1fr; min-height: 360px; }
.channel-info { padding: 20px; border-right: 1px solid var(--line); background: #fafafa; }
.channel-info-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.channel-name { font-size: 15px; font-weight: 600; }
.meta-list { list-style: none; padding: 0; margin: 0; }
.meta-list li { display: flex; margin-bottom: 10px; font-size: 13px; }
.meta-list .k { color: var(--muted); width: 68px; flex-shrink: 0; }
.meta-list .v { flex: 1; word-break: break-all; }

.channel-main { padding: 16px 20px 20px; min-width: 0; }
.section-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.section-title { font-weight: 600; font-size: 15px; }
.section-sub { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: normal; }
.section-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mode-badge {
  font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: normal;
}
.mode-badge.view { background: #f5f5f5; color: var(--muted); }
.mode-badge.edit { background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }

/* Time slots */
.slot-bar { margin-bottom: 12px; }
.slot-bar-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.slot-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.slot-tab {
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  font-size: 13px; background: #fafafa; transition: all .2s; display: inline-flex; align-items: center; gap: 6px;
}
.slot-tab:hover { border-color: var(--primary); color: var(--primary); }
.slot-tab.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 500; }
.slot-tab .slot-tag { font-size: 11px; color: var(--muted); margin-left: 2px; }
.slot-tab.active .slot-tag { color: #4096ff; }
.slot-tip {
  font-size: 12px; color: #595959; background: #fafafa; border: 1px dashed #d9d9d9;
  border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; line-height: 1.6;
}
.slot-tab .slot-actions { display: inline-flex; gap: 2px; margin-left: 4px; }
.slot-tab .slot-actions button {
  border: none; background: none; cursor: pointer; padding: 0 3px; font-size: 12px; color: var(--muted);
}
.slot-tab .slot-actions button:hover { color: var(--primary); }
.slot-tab .slot-actions button.del:hover { color: var(--danger); }
.th-with-btn { display: inline-flex; align-items: center; gap: 6px; }
.th-with-btn .btn-reset-stats {
  height: 22px; padding: 0 6px; font-size: 12px; font-weight: normal; border: none;
  background: none; color: var(--primary); cursor: pointer;
}
.th-with-btn .btn-reset-stats:hover { text-decoration: underline; }
.tag-green { display: inline-block; padding: 0 8px; height: 22px; line-height: 22px; border-radius: 4px; font-size: 12px; background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }

.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { background: #fafafa; font-weight: 600; color: #595959; font-size: 13px; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
td input[type="number"] { width: 72px; }
.ratio-cell { font-size: 12px; line-height: 1.6; }
.ratio-cell .expected { color: var(--ink); }
.ratio-cell .realtime { color: var(--muted); }
.assistant-name { font-weight: 500; }
.assistant-id { font-size: 12px; color: var(--muted); margin-top: 2px; }
.readonly-weight { font-weight: 500; }
.checkbox { width: 16px; height: 16px; cursor: pointer; }
.add-row-btn {
  width: 100%; padding: 10px; border: 1px dashed #d9d9d9; border-radius: 0 0 6px 6px;
  background: #fafafa; cursor: pointer; color: var(--primary); font: inherit;
}
.add-row-btn:hover { border-color: var(--primary); background: var(--primary-light); }

.tip-box {
  background: var(--primary-light); border: 1px solid #91caff; border-radius: 6px;
  padding: 10px 14px; font-size: 13px; color: #0958d9; margin-bottom: 14px;
}
.empty { text-align: center; padding: 40px; color: var(--muted); }
.hidden { display: none !important; }

.modal-mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: #fff; border-radius: 8px; width: 100%; max-width: 560px;
  box-shadow: 0 6px 16px rgba(0,0,0,.08); max-height: 90vh; overflow: auto;
}
.modal.wide { max-width: 680px; }
.modal-header {
  padding: 16px 24px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 12px 24px 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); }
.form-row { margin-bottom: 16px; }
.form-row label { display: block; margin-bottom: 6px; font-size: 13px; }
.form-row .req { color: var(--danger); margin-right: 2px; }
.form-row .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.form-row-inline { display: flex; gap: 12px; }
.form-row-inline > div { flex: 1; }
.form-row.readonly input, .form-row.readonly select { background: #f5f5f5; color: var(--muted); pointer-events: none; }

.toast-area { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 16px; border-radius: 6px; background: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.12);
  border: 1px solid var(--line); font-size: 13px; min-width: 200px;
}
.toast.success { border-color: #b7eb8f; background: #f6ffed; }
.toast.error { border-color: #ffccc7; background: #fff2f0; }

@media (max-width: 960px) {
  .channel-inner { grid-template-columns: 1fr; }
  .channel-info { border-right: none; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="page">
  <h1 class="page-title">流量管理 · 排班权重配置</h1>
  <p class="page-desc">按时间段预设权重，默认全天；新增时段后剩余时间自动分组。查看状态只读，编辑状态支持增删改。</p>

  <div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="team">团队流量分配</div>
    <div class="tab" data-tab="assistant">医助流量分配</div>
  </div>
  <div class="sub-tabs hidden" id="assistantSubTabs">
    <div class="sub-tab" data-sub="general">团队通用</div>
    <div class="sub-tab active" data-sub="specified">指定医助</div>
  </div>

  <div class="filter-bar" id="filterBar"></div>
  <div id="channelList"></div>
</div>
<div class="toast-area" id="toastArea"></div>
<div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  function makeAssistants() {
    const list = [
      { name: '熊国庆100lfy', wxId: 'XIONG', doctor: '袁一娟', weight: 100, expose: 1, teamRatioExp: 5.76, teamRatioRt: 11.11, docRatioExp: 0.36, docRatioRt: 0.69 },
      { name: '李付印100lfy', wxId: 'LFY', doctor: '李付印', weight: 80, expose: 0, teamRatioExp: 4.61, teamRatioRt: 0, docRatioExp: 0.29, docRatioRt: 0 },
      { name: '朱子玉100lfy', wxId: 'ZZY', doctor: '朱子玉', weight: 0, expose: 0, teamRatioExp: 0, teamRatioRt: 0, docRatioExp: 0, docRatioRt: 0 },
      { name: '刘燕100lfy', wxId: 'LY', doctor: '刘燕', weight: 0, expose: 0, teamRatioExp: 0, teamRatioRt: 0, docRatioExp: 0, docRatioRt: 0 },
      { name: '王芳100lfy', wxId: 'WF', doctor: '袁一娟', weight: 0, expose: 0, teamRatioExp: 0, teamRatioRt: 0, docRatioExp: 0, docRatioRt: 0 },
      { name: '赵敏100lfy', wxId: 'ZM', doctor: '李付印', weight: 0, expose: 0, teamRatioExp: 0, teamRatioRt: 0, docRatioExp: 0, docRatioRt: 0 }
    ];
    return list.map((a, i) => ({ ...a, id: 'as_' + i }));
  }

  function cloneItems(items) {
    return items.map(i => ({ ...i, id: uid() }));
  }

  const TEAM_ITEMS = [
    { id: 't1', name: 'AIGC运营部-流量B组', weight: 18, expose: 45, actual: 16 },
    { id: 't2', name: '流量CD组-流量C组', weight: 34, expose: 88, actual: 32 },
    { id: 't3', name: '流量CD组-流量D组', weight: 34, expose: 92, actual: 34 },
    { id: 't4', name: 'AIGC运营部-流量H组', weight: 14, expose: 38, actual: 18 }
  ];

  const MOCK = {
    team: [
      {
        id: 'ch1', platform: '百度营销', channelName: '百度大搜_B页', channelCode: 'Baidu_Search_PageB',
        trafficType: '指定医助', doctors: '袁一娟、李付印、朱子玉、刘燕',
        slots: [
          { id: 's1', slotRole: 'fallback', start: '00:00', end: '08:00', items: TEAM_ITEMS.map(i => ({ ...i, weight: 25 })) },
          { id: 's2', slotRole: 'custom', start: '08:00', end: '14:00', items: TEAM_ITEMS.map(i => ({ ...i, weight: i.id === 't1' ? 10 : i.id === 't2' ? 40 : i.id === 't3' ? 40 : 10 })) },
          { id: 's3', slotRole: 'fallback', start: '14:00', end: '24:00', items: TEAM_ITEMS.map(i => ({ ...i, weight: 25 })) }
        ]
      },
      {
        id: 'ch2', platform: '其他', channelName: '官网', channelCode: 'official_website',
        trafficType: '团队通用', doctors: '朱子玉、李付印',
        slots: [{ id: 's0', slotRole: 'fallback', start: '00:00', end: '24:00', items: [
          { id: 't5', name: '流量CD组-流量C组', weight: 50, expose: 120, actual: 48 },
          { id: 't6', name: '流量CD组-流量D组', weight: 50, expose: 115, actual: 52 }
        ]}]
      }
    ],
    assistantGeneral: [
      {
        id: 'ag1', platform: '—', channelName: '—', channelCode: '—',
        team: '流量CD组-流量C组', doctors: '朱子玉', trafficType: '团队通用',
        slots: [{ id: 's0', slotRole: 'fallback', start: '00:00', end: '24:00', items: makeAssistants().slice(0, 4).map(a => ({
          ...a,
          weight: a.id === 'as_0' ? 50 : a.id === 'as_1' ? 50 : 0,
          expose: a.id === 'as_0' ? 6 : a.id === 'as_1' ? 5 : 0,
          teamRatioExp: a.id === 'as_0' ? 2.88 : a.id === 'as_1' ? 2.88 : 0,
          teamRatioRt: a.id === 'as_0' ? 3.1 : a.id === 'as_1' ? 2.6 : 0,
          docRatioExp: a.id === 'as_0' ? 0.18 : a.id === 'as_1' ? 0.18 : 0,
          docRatioRt: a.id === 'as_0' ? 0.19 : a.id === 'as_1' ? 0.16 : 0
        })) }]
      }
    ],
    assistantSpecified: [
      {
        id: 'as1', platform: '百度营销', channelName: '百度大搜_B页', channelCode: 'Baidu_Search_PageB',
        team: '流量CD组-流量C组', doctors: '袁一娟、李付印、朱子玉、刘燕、李付印、朱子玉',
        trafficType: '指定医助',
        slots: [
          { id: 'as_s1', slotRole: 'fallback', start: '00:00', end: '08:00', items: makeAssistants().map(a => ({ ...a, weight: a.id === 'as_0' ? 100 : 0, expose: a.id === 'as_0' ? 1 : 0, teamRatioExp: a.id === 'as_0' ? 5.76 : 0, teamRatioRt: a.id === 'as_0' ? 11.11 : 0, docRatioExp: a.id === 'as_0' ? 0.36 : 0, docRatioRt: a.id === 'as_0' ? 0.69 : 0 })) },
          { id: 'as_s2', slotRole: 'custom', start: '08:00', end: '14:00', items: makeAssistants().map(a => ({ ...a, weight: a.id === 'as_0' ? 60 : a.id === 'as_1' ? 40 : 0, expose: a.id === 'as_0' ? 3 : a.id === 'as_1' ? 2 : 0, teamRatioExp: a.id === 'as_0' ? 3.46 : a.id === 'as_1' ? 2.31 : 0, teamRatioRt: a.id === 'as_0' ? 4.2 : a.id === 'as_1' ? 2.8 : 0, docRatioExp: a.id === 'as_0' ? 0.22 : a.id === 'as_1' ? 0.15 : 0, docRatioRt: a.id === 'as_0' ? 0.26 : a.id === 'as_1' ? 0.17 : 0 })) },
          { id: 'as_s3', slotRole: 'fallback', start: '14:00', end: '24:00', items: makeAssistants().map(a => ({ ...a, weight: a.id === 'as_0' ? 100 : 0, expose: a.id === 'as_0' ? 5 : 0, teamRatioExp: a.id === 'as_0' ? 5.76 : 0, teamRatioRt: a.id === 'as_0' ? 5.5 : 0, docRatioExp: a.id === 'as_0' ? 0.36 : 0, docRatioRt: a.id === 'as_0' ? 0.35 : 0 })) }
        ]
      },
      {
        id: 'as2', platform: '其他', channelName: '官网', channelCode: 'official_website',
        team: '流量CD组-流量D组', doctors: '朱子玉、李付印',
        trafficType: '指定医助',
        slots: [{ id: 'as_s0', slotRole: 'fallback', start: '00:00', end: '24:00', items: makeAssistants().slice(0, 4).map(a => ({
          ...a,
          weight: a.id === 'as_0' ? 100 : a.id === 'as_1' ? 80 : 0,
          expose: a.id === 'as_0' ? 12 : a.id === 'as_1' ? 8 : 0,
          teamRatioExp: a.id === 'as_0' ? 5.76 : a.id === 'as_1' ? 4.61 : 0,
          teamRatioRt: a.id === 'as_0' ? 6.2 : a.id === 'as_1' ? 4.1 : 0,
          docRatioExp: a.id === 'as_0' ? 0.36 : a.id === 'as_1' ? 0.29 : 0,
          docRatioRt: a.id === 'as_0' ? 0.38 : a.id === 'as_1' ? 0.25 : 0
        })) }]
      }
    ]
  };

  const state = {
    tab: 'team',
    assistantSub: 'specified',
    editMode: {},
    selectedSlot: {},
    draftBackup: {},
    modal: null,
    filters: {}
  };

  function uid() { return 'id_' + Math.random().toString(36).slice(2, 9); }
  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg;
    document.getElementById('toastArea').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function timeToMin(t) {
    if (!t || t === '24:00') return t === '24:00' ? 1440 : 0;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }
  function minToTime(m) {
    m = ((m % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function slotLabel(s) {
    return s.start + ' - ' + (s.end === '24:00' ? '24:00' : s.end);
  }
  function isFullDaySlot(s) { return s.start === '00:00' && s.end === '24:00'; }
  const FALLBACK_GROUP_ID = '__fallback__';

  function getFallbackSlots(ch) {
    return normalizeSlots(ch.slots.filter(s => s.slotRole === 'fallback'));
  }

  function getCustomSlots(ch) {
    return normalizeSlots(ch.slots.filter(s => s.slotRole === 'custom'));
  }

  function isOnlyFallback(ch) {
    const fallbacks = getFallbackSlots(ch);
    return fallbacks.length === 1 && isFullDaySlot(fallbacks[0]) && getCustomSlots(ch).length === 0;
  }

  /** 剩余时段合并为一组，与自定义时段并列展示 */
  function getDisplayGroups(ch) {
    const fallbacks = getFallbackSlots(ch);
    const customs = getCustomSlots(ch);
    const groups = [];

    if (fallbacks.length) {
      if (isOnlyFallback(ch)) {
        groups.push({
          id: fallbacks[0].id,
          type: 'fallback',
          slots: fallbacks,
          label: '00:00 - 24:00'
        });
      } else {
        const ranges = fallbacks.map(s => s.start + '-' + (s.end === '24:00' ? '24:00' : s.end)).join('、');
        groups.push({
          id: FALLBACK_GROUP_ID,
          type: 'fallback',
          slots: fallbacks,
          label: '剩余时段 · ' + ranges
        });
      }
    }
    customs.forEach(s => {
      groups.push({
        id: s.id,
        type: 'custom',
        slots: [s],
        label: s.start + ' - ' + (s.end === '24:00' ? '24:00' : s.end)
      });
    });
    return groups;
  }

  function getGroupById(ch, groupId) {
    return getDisplayGroups(ch).find(g => g.id === groupId);
  }

  /** 解析当前选中配置组（兼容旧 slot id） */
  function resolveActiveGroup(ch) {
    const groups = getDisplayGroups(ch);
    const sel = state.selectedSlot[ch.id];
    let group = groups.find(g => g.id === sel);
    if (!group && sel) {
      group = groups.find(g => g.slots.some(s => s.id === sel));
      if (group) state.selectedSlot[ch.id] = group.id;
    }
    return group || groups[0];
  }

  /** 多段剩余时段共用首段权重，统计聚合展示 */
  function getGroupDisplayItems(group) {
    const base = group.slots[0].items;
    if (group.type !== 'fallback' || group.slots.length <= 1) {
      return calcRatio(base);
    }
    return calcRatio(base.map(item => {
      let expose = 0;
      group.slots.forEach(slot => {
        const it = slot.items.find(i => i.name === item.name || i.id === item.id);
        if (it) expose += it.expose || 0;
      });
      return { ...item, expose };
    }));
  }

  function syncFallbackSlotItems(slots) {
    const sorted = normalizeSlots(slots);
    const fallbacks = sorted.filter(s => s.slotRole === 'fallback');
    if (fallbacks.length > 1) {
      const base = cloneItems(fallbacks[0].items);
      fallbacks.forEach(s => { s.items = cloneItems(base); });
    }
    return sorted;
  }

  function syncGroupItems(ch, group) {
    if (group.type !== 'fallback' || group.slots.length <= 1) return;
    const base = cloneItems(group.slots[0].items);
    group.slots.forEach(s => { s.items = cloneItems(base); });
  }

  function findItemInGroup(group, itemId) {
    for (const slot of group.slots) {
      const it = slot.items.find(i => i.id === itemId);
      if (it) return it;
    }
    return null;
  }

  function setGroupItemWeight(ch, groupId, itemId, weight) {
    const group = getGroupById(ch, groupId);
    if (!group) return;
    group.slots.forEach(slot => {
      slot.items.forEach(it => {
        const match = it.id === itemId || group.slots[0].items.find(b => b.id === itemId)?.name === it.name;
        if (it.id === itemId || (group.type === 'fallback' && group.slots[0].items.find(b => b.id === itemId)?.name === it.name)) {
          it.weight = weight;
        }
      });
    });
    syncGroupItems(ch, group);
  }
  function calcRatio(items) {
    const total = items.reduce((s, i) => s + (Number(i.weight) || 0), 0);
    return items.map(i => ({ ...i, ratio: total > 0 ? Math.round((Number(i.weight) || 0) / total * 10000) / 100 : 0 }));
  }

  function getCurrentSlotId(ch) {
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    for (const slot of ch.slots) {
      const start = timeToMin(slot.start);
      let end = timeToMin(slot.end);
      if (end <= start) {
        if (nowMin >= start || nowMin < end) return slot.id;
      } else if (nowMin >= start && nowMin < end) return slot.id;
    }
    return ch.slots[0]?.id;
  }

  /** 在兜底时段内插入自定义时段，剩余时间自动拆为 fallback */
  function splitSlotAt(slots, newStart, newEnd) {
    const ns = timeToMin(newStart);
    let ne = timeToMin(newEnd);
    if (newEnd === '24:00') ne = 1440;
    if (ne <= ns) { toast('结束时间须大于开始时间', 'error'); return null; }

    const result = [];
    let inserted = false;
    const endLabel = ne >= 1440 ? '24:00' : newEnd;

    for (const slot of normalizeSlots(slots)) {
      const ss = timeToMin(slot.start);
      let se = timeToMin(slot.end);
      if (slot.end === '24:00' || se <= ss) se = 1440;

      if (ne <= ss || ns >= se) {
        result.push({ ...slot, items: cloneItems(slot.items) });
        continue;
      }

      if (ns > ss) {
        result.push({ id: uid(), slotRole: 'fallback', start: slot.start, end: newStart, items: cloneItems(slot.items) });
      }
      result.push({
        id: uid(), slotRole: 'custom', start: newStart, end: endLabel,
        items: cloneItems(slot.items)
      });
      inserted = true;
      if (ne < se) {
        result.push({ id: uid(), slotRole: 'fallback', start: endLabel, end: slot.end, items: cloneItems(slot.items) });
      }
    }

    if (!inserted) { toast('新时段须落在已有时间段范围内', 'error'); return null; }
    return syncFallbackSlotItems(normalizeSlots(result));
  }

  /** 从全天兜底重建所有自定义时段 */
  function rebuildWithCustoms(fallbackItems, customs) {
    let slots = [{ id: uid(), slotRole: 'fallback', start: '00:00', end: '24:00', items: cloneItems(fallbackItems) }];
    const sorted = [...customs].sort((a, b) => timeToMin(a.start) - timeToMin(b.start));
    for (const c of sorted) {
      const endVal = c.end === '24:00' || timeToMin(c.end) >= 1440 ? '24:00' : c.end;
      const next = splitSlotAt(slots, c.start, endVal);
      if (!next) return null;
      const custom = next.find(s => s.slotRole === 'custom' && s.start === c.start && s.end === endVal);
      if (custom) custom.items = cloneItems(c.items);
      slots = next;
    }
    return syncFallbackSlotItems(slots);
  }

  /** 编辑自定义时段起止 */
  function updateSlotTime(slots, slotId, newStart, newEnd) {
    const slot = slots.find(s => s.id === slotId);
    if (!slot || slot.slotRole !== 'custom') { toast('仅自定义时段支持修改时间', 'error'); return null; }
    let ne = newEnd;
    if (newEnd === '23:59') ne = '24:00';
    const fallbackItems = slots.find(s => s.slotRole === 'fallback')?.items || slot.items;
    const customs = slots.filter(s => s.slotRole === 'custom').map(s =>
      s.id === slotId ? { start: newStart, end: ne, items: s.items } : { start: s.start, end: s.end, items: s.items }
    );
    return rebuildWithCustoms(fallbackItems, customs);
  }

  /** 删除自定义时段，时间回归相邻剩余时段 */
  function deleteSlot(slots, slotId) {
    const slot = slots.find(s => s.id === slotId);
    if (!slot || slot.slotRole !== 'custom') { toast('兜底/剩余时段不支持删除', 'error'); return null; }

    const sorted = normalizeSlots([...slots]);
    const idx = sorted.findIndex(s => s.id === slotId);
    const prev = sorted[idx - 1];
    const next = sorted[idx + 1];

    if (prev && prev.slotRole === 'fallback') {
      prev.end = next && next.slotRole === 'fallback' ? next.end : slot.end;
      sorted.splice(idx, next && next.slotRole === 'fallback' ? 2 : 1);
    } else if (next && next.slotRole === 'fallback') {
      next.start = slot.start;
      sorted.splice(idx, 1);
    } else {
      sorted.splice(idx, 1);
    }

    const result = mergeAdjacentFallbacks(sorted.map(s => ({ ...s, items: cloneItems(s.items) })));
    if (result.length === 1 && isFullDaySlot(result[0])) result[0].slotRole = 'fallback';
    return result;
  }

  function mergeAdjacentFallbacks(slots) {
    const sorted = normalizeSlots(slots);
    const result = [];
    for (const s of sorted) {
      const last = result[result.length - 1];
      if (last && last.slotRole === 'fallback' && s.slotRole === 'fallback' && last.end === s.start) {
        last.end = s.end;
      } else {
        result.push({ ...s });
      }
    }
    return result;
  }

  function normalizeSlots(slots) {
    return [...slots]
      .sort((a, b) => timeToMin(a.start) - timeToMin(b.start))
      .map(s => ({ ...s, start: s.start, end: s.end === '00:00' && timeToMin(s.start) > 0 ? '24:00' : s.end }));
  }

      case 'save-edit':
        delete state.draftBackup[channelId];
        delete state.editMode[channelId];
        render();
        toast('配置已保存', 'success');
        break;
      case 'select-slot':
        state.selectedSlot[channelId] = slotId;
        render();
        break;
      case 'add-slot':
        if (!isEditing(channelId)) return;
        openModal('addSlot', { channelId });
        break;
      case 'edit-slot-time':
        if (!isEditing(channelId)) return;
        openModal('editSlot', { channelId, slotId });
        break;
      case 'delete-slot': {
        if (!isEditing(channelId)) return;
        const next = deleteSlot(ch.slots, slotId);
        if (next) {
          ch.slots = syncFallbackSlotItems(next);
          const groups = getDisplayGroups(ch);
          if (!groups.find(g => g.id === state.selectedSlot[channelId])) {
            state.selectedSlot[channelId] = groups[0]?.id;
          }
          render();
          toast('自定义时段已删除，剩余时段已合并');
        }
        break;
      }
      case 'batch-weight':
        if (!isEditing(channelId)) return;
        openModal('batchWeight', { channelId });
        break;
      case 'edit-traffic-type':
        openModal('editTrafficType', { channelId });
        break;
      case 'add-assistant': {
        if (!isEditing(channelId)) return;
        const group = getGroupById(ch, slotId || state.selectedSlot[channelId] || getDisplayGroups(ch)[0]?.id);
        if (!group) break;
        const item = {
          id: uid(), name: '新医助', wxId: 'NEW001', doctor: '袁一娟', weight: 0,
          expose: 0, teamRatioExp: 0, teamRatioRt: 0, docRatioExp: 0, docRatioRt: 0
        };
        group.slots.forEach(s => s.items.push({ ...item }));
        syncGroupItems(ch, group);
        render();
        break;
      }
      case 'add-team': {
        const group = getGroupById(ch, slotId);
        if (!group) break;
        const item = { id: uid(), name: '新团队', weight: 0, expose: 0, actual: 0 };
        group.slots.forEach(s => s.items.push({ ...item }));
        syncGroupItems(ch, group);
        render();
        break;
      }
      case 'delete-item': {
        const group = getGroupById(ch, slotId);
        if (!group) break;
        group.slots.forEach(s => { s.items = s.items.filter(i => i.id !== itemId); });
        render();
        toast('已删除');
        break;
      }
      case 'reset-stats':
        ch.slots.forEach(s => s.items.forEach(i => { i.expose = 0; i.actual = 0; i.teamRatioRt = 0; i.docRatioRt = 0; }));
        render();
        toast('统计已重置');
        break;
      case 'delete-channel':
        toast('删除渠道（原型演示）');
        break;
    }
  });

  document.getElementById('channelList').addEventListener('input', e => {
    const input = e.target.closest('[data-action="weight-change"]');
    if (!input || !isEditing(input.dataset.channel)) return;
    const ch = findChannel(input.dataset.channel);
    let v = parseInt(input.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    if (v > 100) v = 100;
    setGroupItemWeight(ch, input.dataset.slot, input.dataset.item, v);
    render();
  });

  document.getElementById('modalRoot').addEventListener('click', e => {
    if (e.target.classList.contains('modal-mask')) { closeModal(); return; }

    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;

    if (action === 'close-modal') { closeModal(); return; }

    function readSlotEnd() {
      let end = document.getElementById('slotEnd').value;
      if (end === '23:59') end = '24:00';
      return end;
    }

    if (action === 'confirm-add-slot') {
      const ch = findChannel(btn.dataset.channel);
      if (!ch) { toast('数据不存在', 'error'); return; }
      const start = document.getElementById('slotStart').value;
      const end = readSlotEnd();
      if (!start || !end) { toast('请选择开始和结束时间', 'error'); return; }
      const next = splitSlotAt(ch.slots, start, end);
      if (next) {
        ch.slots = next;
        const endLabel = timeToMin(end) >= 1440 || end === '24:00' ? '24:00' : end;
        const newSlot = next.find(s => s.slotRole === 'custom' && s.start === start && s.end === endLabel);
        if (newSlot) state.selectedSlot[ch.id] = newSlot.id;
        closeModal();
        render();
        toast('时段已添加，已定位到新时段，请设置权重', 'success');
      }
      return;
    }

    if (action === 'confirm-edit-slot') {
      const ch = findChannel(btn.dataset.channel);
      const start = document.getElementById('slotStart').value;
      const end = readSlotEnd();
      const next = updateSlotTime(ch.slots, btn.dataset.slot, start, end);
      if (next) {
        ch.slots = next;
        const endLabel = timeToMin(end) >= 1440 || end === '24:00' ? '24:00' : end;
        const edited = next.find(s => s.slotRole === 'custom' && s.start === start && s.end === endLabel);
        if (edited) state.selectedSlot[ch.id] = edited.id;
        closeModal(); render(); toast('时段已更新', 'success');
      }
      return;
    }

    if (action === 'confirm-batch') {
      const ch = findChannel(btn.dataset.channel);
      const group = resolveActiveGroup(ch);
      if (!group) return;
      const w = parseInt(document.getElementById('batchWeight').value, 10) || 0;
      group.slots.forEach(slot => slot.items.forEach(i => { i.weight = w; }));
      syncGroupItems(ch, group);
      closeModal(); render(); toast('批量权重已更新', 'success');
      return;
    }

    if (action === 'confirm-edit-traffic-type') {
      const ch = findChannel(btn.dataset.channel);
      ch.trafficType = document.getElementById('trafficTypeSelect').value;
      closeModal(); render(); toast('流量类型已更新', 'success');
      return;
    }
  });

  render();
})();
</script>
</body>
</html>
